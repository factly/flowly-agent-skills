name: CI

# Every gate this distribution has, run on every change.
#
# ONE JOB PER GATE, AND NO `needs:` EDGES BETWEEN THEM
# ----------------------------------------------------
# GitHub shows job names in the checks list and step names only once you open
# the log. So the unit of "what broke" is the job, and each gate here gets one.
# A red run names the gate on the summary page: `Ownership register`,
# `No hostname or workspace path`, `Install door`.
#
# Nothing is gated behind anything else, deliberately. Sequencing would save a
# few runner-minutes on a doomed run and cost the thing this repository most
# needs: the monthly upstream merge is one event that can break several gates at
# once, and a resolver wants the whole list from one run rather than one gate
# per iteration. A skipped job is also not a passed job, and a wall of grey
# `skipped` badges is exactly the report that gets misread as "only one thing
# is wrong".
#
# The `install` job in particular is NOT gated behind `manifests`. The
# acceptance for this workflow is verified by breaking a manifest on purpose and
# watching the INSTALL job go red; if install were gated it would be skipped
# instead, and that probe could not be run at all.
#
# That probe was run locally against claude 2.1.220, setting
# `plugins[0].name` to an integer, and it is worth recording exactly where it
# lands, because it is not where you would guess:
#
#     claude plugin validate --strict .              exit 1   (manifests job)
#     claude plugin marketplace add ./               exit 0   ← passes
#     claude plugin install flowly@flowly-agent-skills   exit 1   (install job)
#
# So `marketplace add` accepts a manifest that `validate` rejects, and the
# install job goes red one step later — with a message that blames a stale local
# copy ("Your local copy may be out of date") rather than naming the type error.
# Both jobs are needed: `manifests` is the one that says what is actually wrong.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing here publishes, comments, or writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; runs on the default branch are not,
  # because those are the ones anyone later goes looking for.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Node 24 is the Active LTS (since 2025-10-28, supported to 2028-04-30).
#
# Pinned to a major rather than `lts/*` for the same reason every other version
# in this repository is pinned: a floating pin turns someone else's release into
# a surprise failure here. Move it on purpose, having read the changelog.
#
# It was '20' until this line changed, and 20 reached END OF LIFE on 2026-04-30
# — so the first green CI run was green on an unsupported runtime, which is the
# kind of thing a passing build is very good at hiding. GitHub's own annotation
# is what surfaced it, and that annotation was about the ACTION's runtime, not
# this value; the two are separate and both were stale.
env:
  NODE_VERSION: '24'

jobs:
  # ── Skill content ───────────────────────────────────────────────────────────

  skills:
    name: Skill anatomy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Every SKILL.md matches the anatomy this repo documents
        run: node scripts/validate-skills.js

  standard:
    name: Agent Skills open standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This gate is one half of what holds the doors this fork does not ship
      # openable: frontmatter limited to `name` and `description`. See
      # docs/install.md § Doors kept openable.
      #
      # The script also accepts `--reference`, which drives the standard's own
      # pinned reference validator (`skills-ref@0.1.5`) over every skill via npx.
      # It stays off here, and the reason is stronger than the npm download:
      #
      # `skills-ref` enforces the SPEC's six-field frontmatter set. This fork
      # holds a two-field intersection, because two is what loads on every door.
      # So the reference validator CANNOT enforce the rule this gate exists to
      # enforce. Measured both ways: `allowed-tools: Bash` added to a SKILL.md is
      # a legal spec field that skills-ref exits 0 on, and that this script
      # rejects — verified against the current corpus at `1 violation(s) —
      # FAILED`. Its own README also states it is for demonstration and not
      # production.
      #
      # It stays wired as an opt-in flag rather than deleted, because "every
      # skill is valid under the open standard" is a claim about a corpus that
      # grows, and a claim nothing can re-check is a claim that rots. Run it by
      # hand when the spec moves; do not put it on the critical path of a check
      # that must work on a public repository's first commit.
      - name: Every skill is valid under the open standard, two fields only
        run: bash scripts/validate-standard.sh

  # ── The one-way door ────────────────────────────────────────────────────────

  hosts:
    name: No hostname or workspace path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # This repository has been public since its first commit. A hostname that
      # reaches a public commit cannot be withdrawn — not by a force-push, not
      # by making the repository private. Every other gate here guards something
      # recoverable; this one does not.
      # The checker first, then its verdict. This gate guards the one mistake
      # that cannot be undone, so its green has to mean something: a checker
      # that reported nothing would pass this job every time.
      - name: The host checker works
        run: node --test scripts/check-no-hosts-test.js

      - name: Nothing host-shaped or user-path-shaped is about to be published
        run: node scripts/check-no-hosts.js

  # ── The fork ────────────────────────────────────────────────────────────────

  binding:
    name: Flowly binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: No shipped file still points at a planning destination we removed
        run: node scripts/check-binding.js

  register:
    name: Ownership register
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 IS THE GATE. This is not tidiness.
      #
      # actions/checkout defaults to a shallow clone, and the base SHA in
      # NOTICE.md is then not a commit this checkout can see. Measured on a
      # --depth 1 clone, check-register.js reports:
      #
      #     ✗  base SHA
      #          ERROR: Base SHA is not a commit in this repository: bdf76c7…
      #     –  `unchanged` really is unchanged — skipped, the base SHA above is unusable
      #     –  `bound` really is bound — skipped, the base SHA above is unusable
      #
      # The run is red, but for the wrong reason, and the two checks that
      # actually protect the fork — the byte-for-byte comparisons against
      # upstream — are SKIPPED, not failed. Anyone who "fixed" the red by
      # relaxing the base-SHA assertion would get a green run with both
      # comparisons silently disabled forever.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `shell: bash` rather than the default, because it adds `-o pipefail`:
      # without it the pipe into tee would report tee's exit code and this gate
      # would pass on a failing check.
      - name: The register and the tree describe the same set of files
        shell: bash
        run: node scripts/check-register.js | tee "$RUNNER_TEMP/register.log"

      # A check that can silently skip needs its own presence asserted. Today a
      # skip is accompanied by a base-SHA error, so the exit code above does
      # catch it — but that is a coupling inside another script, not a property
      # anything declares. This step asserts the two comparisons RAN, so the
      # protection survives someone loosening the base-SHA assertion.
      - name: Prove the byte-for-byte comparisons ran rather than skipped
        shell: bash
        run: |
          ran=1
          grep -qF '✓  `unchanged` really is unchanged' "$RUNNER_TEMP/register.log" || ran=0
          grep -qF '✓  `bound` really is bound'         "$RUNNER_TEMP/register.log" || ran=0
          if [ "$ran" -ne 1 ]; then
            echo '::error::check-register.js exited 0 without running the byte-for-byte comparisons against the base SHA.'
            echo '::error::Those two checks SKIP — they do not fail — when the base SHA is unreachable, which is what a shallow clone produces.'
            echo '::error::Restore fetch-depth: 0 on the checkout in this job.'
            grep -F 'really is' "$RUNNER_TEMP/register.log" || true
            exit 1
          fi

      # Shares this job because it shares the precondition: it diffs the tree
      # against the same base SHA and is meaningless on a shallow clone. It
      # reports the fetch-depth cause itself rather than failing obscurely.
      - name: The checker for recorded deletions works
        run: node --test scripts/check-deletions-test.js

      # The register covers files that EXIST. This covers the ones that do not.
      # A merge cannot tell "an inherited file is gone" from "an inherited file
      # was never here", so upstream offers every deletion back as a
      # modify/delete conflict and an unrecorded one gets silently reinstated.
      - name: Every inherited file this fork deleted is recorded in NOTICE.md
        run: node scripts/check-deletions.js

  # ── Routing and wiring ──────────────────────────────────────────────────────

  catalog:
    name: Skill catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The checker first, then its verdict. A broken checker's green is not
      # evidence about the catalog.
      - name: The catalog checker works
        run: node --test scripts/check-catalog-test.js

      - name: Every hand-maintained list of skills matches the tree, both directions
        run: node scripts/check-catalog.js

  commands:
    name: Lifecycle commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The other half of what holds the unshipped doors openable: no
      # substitution token in any command body. See docs/install.md.
      - name: Six commands, no substitution tokens, every named skill resolves
        run: node scripts/check-commands.js

  command-refs:
    name: Command references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The checker first, then its verdict. A broken checker's green is not
      # evidence about the corpus.
      - name: The reference checker works
        run: node --test scripts/check-command-refs-test.js

      # The mirror image of the `commands` job above. That one looks outward
      # from `commands/` and validates each command against the skills it names.
      # This one looks the other way — at everything that tells a reader which
      # command to type — and it is the gate that turns an upstream merge
      # reinstating a bare, un-namespaced command name into a red run instead of
      # a hunk somebody has to notice. See NOTICE.md § Statuses.
      - name: Every /command written in the shipped corpus resolves to one on disk
        run: node scripts/check-command-refs.js

  tool-drift:
    name: Tool drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The drift checker works
        run: node --test scripts/check-tool-drift-test.js

      # Snapshot mode — the default, and the only mode CI can run.
      #
      # NO CREDENTIAL AND NO ENDPOINT BELONG IN THIS FILE. `--live` reads
      # FLOWLY_MCP_URL and FLOWLY_MCP_TOKEN from the environment and answers the
      # question this mode cannot: whether Flowly has renamed a tool since the
      # snapshot was taken. That mode is for a human or a private scheduled job
      # against a real instance. Wiring it here would mean putting an instance
      # hostname into a public repository, which is the one mistake nothing can
      # undo — see the `hosts` job above.
      - name: Every Flowly tool the corpus names is in the pinned snapshot
        run: node scripts/check-tool-drift.js

  round-trip:
    name: Round-trip case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The case checker works
        run: node --test scripts/check-round-trip-case-test.js

      # `claude plugin eval` is in early access, so the case itself cannot be
      # RUN — here or anywhere. That is precisely why this gate matters: the one
      # artifact measuring the product's central claim is the one artifact
      # nothing executes, and without this job a corrupt `case.yaml` passes every
      # other gate in this file. The checker needs `ruby` for the YAML parse and
      # reports plainly if it is absent rather than passing silently; the runner
      # image ships it.
      - name: The round-trip case still parses and names only things that exist
        run: node scripts/check-round-trip-case.js

  # ── Behaviour ───────────────────────────────────────────────────────────────

  evals:
    name: Trigger and routing evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The eval runner works
        run: node --test scripts/run-evals-test.js

      # Ranking is zero-sum: adding or renaming one skill re-scores every other
      # one. The floor is the aggregate, not any single skill's row.
      - name: Every skill routes, and rank-1 has not fallen below the floor
        run: node scripts/run-evals.js --min-rank1 80

  hooks:
    name: Session hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The session-start hook survives a stripped PATH
        run: bash hooks/session-start-test.sh

      - name: The simplify-ignore hook behaves with and without jq
        run: bash hooks/simplify-ignore-test.sh

  # ── The shipped door ────────────────────────────────────────────────────────

  manifests:
    name: Plugin manifests (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # WHAT THIS COVERS, MEASURED AGAINST claude 2.1.220
      #
      # Pointed at the repository root, `validate` reads the marketplace
      # manifest AND, through its plugin entry, the fields of the plugin
      # manifest it points at — a bad type in .claude-plugin/plugin.json is
      # reported as `plugins[0] plugin.json → …` and exits 1. Probed. --strict
      # additionally turns warnings, such as an unknown field, into errors; a
      # warning-only run under --strict was probed exiting 1 too.
      #
      # THE TREE-SCANNING FORM IS DELIBERATELY NOT RUN, AND NOT BECAUSE IT IS RED
      #
      # Pointed at .claude-plugin/plugin.json directly, `validate` also scans the
      # plugin TREE. That form exits 1 under --strict on this repository, over:
      #
      #   ⚠ root: CLAUDE.md at the plugin root is not loaded as project context.
      #     To ship context with your plugin, use a skill instead.
      #
      # The warning's premise is that a CLAUDE.md at the plugin root was MEANT to
      # ship as context to plugin users. Ours was not, and says so in its own
      # second paragraph: it configures agents working on this repository. So the
      # finding is a false positive here, and the fix it proposes — move the
      # content into a skill — would ship our contributor guide to every user of
      # the plugin.
      #
      # That alone would argue for running it non-strict. Measured, it does not
      # even earn that. Against claude 2.1.220, with a skill's frontmatter
      # REMOVED ENTIRELY:
      #
      #     node scripts/validate-skills.js                     exit 1  ← ours
      #     claude plugin validate --strict .                   exit 0
      #     claude plugin validate .claude-plugin/plugin.json   exit 0  ← tree scan
      #
      # A name that no longer matches its directory passes both forms too. The
      # tree scan finds nothing our own linter does not, and its only output on
      # this repository is the false positive above. It is not a gap; it is a
      # check that would add a permanent exemption and no coverage.
      - name: Marketplace and plugin manifests validate with warnings fatal
        run: claude plugin validate --strict .

  install:
    name: Install door
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The documented workaround for the SSH-vs-HTTPS clone failure users hit
      # on Windows and macOS. Applied here so CI exercises the same path
      # docs/install.md tells a teammate to take.
      - name: Configure git to clone GitHub over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # Added from the checkout, not from GitHub. This gate is about whether
      # THIS commit's manifests install, not about whether GitHub is reachable —
      # a network flake here would look identical to a broken manifest.
      - name: Add this checkout as a marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install the plugin
        run: claude plugin install flowly@flowly-agent-skills --scope user

      # `install` exiting 0 is not evidence the plugin resolves afterwards.
      # These two steps assert it does: the id appears in the installed list,
      # and the component inventory can be computed — which exits non-zero if
      # the plugin cannot be resolved and loaded.
      - name: The plugin is installed under the id the docs tell people to use
        shell: bash
        run: |
          claude plugin list | tee "$RUNNER_TEMP/plugins.txt"
          if ! grep -qF 'flowly@flowly-agent-skills' "$RUNNER_TEMP/plugins.txt"; then
            echo '::error::claude plugin install exited 0 but flowly@flowly-agent-skills is not in the installed list.'
            exit 1
          fi

      - name: The installed plugin has a component inventory
        run: claude plugin details flowly@flowly-agent-skills

  # ── Aggregate ───────────────────────────────────────────────────────────────

  ci-coverage:
    name: Every gate runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The gate on the gates. It reads this file and asserts that every
      # validator and test suite in `scripts/` and every hook test suite is
      # invoked somewhere above, and that every job above is listed in `gates`
      # below. Both halves were written after a real miss: the round-trip
      # checker and its twenty-one tests sat unwired for a full phase while CI
      # reported all green.
      - name: The coverage checker works
        run: node --test scripts/check-ci-coverage-test.js

      - name: Every shipped gate is wired into this workflow
        run: node scripts/check-ci-coverage.js

  # One status to require in branch protection instead of listing every gate
  # above and having to remember to add the next one. It reports, it does not
  # gate: every job above runs regardless of this one.
  #
  # The `needs:` list is exhaustive by assertion, not by discipline —
  # `check-ci-coverage.js` fails if a job above is missing from it, which is the
  # only thing standing between a new job and a required status that silently
  # stops covering it.
  gates:
    name: All gates green
    runs-on: ubuntu-latest
    if: always()
    needs:
      - skills
      - standard
      - hosts
      - binding
      - register
      - catalog
      - commands
      - command-refs
      - tool-drift
      - round-trip
      - evals
      - hooks
      - manifests
      - install
      - ci-coverage
    steps:
      - name: Result of every gate
        shell: bash
        run: printf '%s\n' '${{ toJSON(needs) }}'

      # `skipped` and `cancelled` count as failure. A gate that did not run is
      # not a gate that passed, and treating either as success is how a required
      # check turns into a green badge that asserts nothing.
      - name: Fail unless every gate succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo '::error::At least one gate did not succeed. See the job list above.'
          exit 1
